<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#130b1a"/><meta name="description" content="Uma retrospectiva especial de Mansueto e Luana, desde 12 de janeiro de 2026."/>
<title>Mansueto & Luana | Nossa História ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
:root{color-scheme:dark;--rose:#ff79af;--gold:#f7d69b;--white:#fff8fc;--muted:#d7c7d5}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#130b1a;color:var(--white);font-family:'DM Sans',system-ui,sans-serif}button{font:inherit}button:focus-visible{outline:3px solid #ffe0a4;outline-offset:4px}.shell{position:relative;isolation:isolate;min-height:100dvh;width:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 10%,#58243e 0%,#271126 40%,#120b18 80%)}.shell:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;background-image:radial-gradient(#fff 0.7px,transparent .7px);background-size:23px 23px;mask-image:linear-gradient(transparent,#000 30%,transparent)}.ambient{position:absolute;inset:auto -30% -45%;height:75vh;background:radial-gradient(ellipse,#9c3458aa,transparent 65%);filter:blur(40px);pointer-events:none}.top{position:absolute;z-index:10;top:max(env(safe-area-inset-top),16px);left:0;right:0;padding:0 18px;display:flex;align-items:center;gap:14px}.bars{display:flex;gap:4px;flex:1}.bar{height:3px;background:#ffffff45;border-radius:20px;overflow:hidden;flex:1}.bar>i{display:block;background:#fff;width:0;height:100%}.bar.done>i{width:100%}.brand{position:absolute;z-index:9;top:45px;left:0;right:0;text-align:center;color:#ffcee0;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:800}.sound{border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:100px;padding:9px;cursor:pointer;min-width:40px;min-height:40px}.scene{position:absolute;inset:0;display:flex;align-items:safe center;overflow-y:auto;justify-content:center;text-align:center;padding:94px 24px 92px;opacity:0;transform:translateY(22px) scale(.98);transition:opacity .55s,transform .55s;pointer-events:none}.scene.active{opacity:1;transform:none;pointer-events:auto}.content{width:min(100%,520px);margin:auto}.eyebrow{text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.24em;color:#ffc0d5;margin:0 0 18px}.heading{font-family:'Playfair Display',Georgia,serif;font-size:clamp(30px,min(9vw,8dvh),65px);line-height:1.12;letter-spacing:-.04em;margin:0 0 22px}.heading em{color:#ff94ba}.subtitle{font-size:16px;line-height:1.65;color:#f4dfe9;max-width:360px;margin:0 auto 24px}.button{cursor:pointer;border:none;border-radius:99px;background:linear-gradient(135deg,#ff9bbd,#ff5c9d);color:#260d22;font-weight:800;padding:15px 26px;box-shadow:0 9px 35px #fa4b9670;display:inline-flex;gap:8px;align-items:center;justify-content:center}.button:active{transform:scale(.97)}.vinyl-wrap{margin:0 auto 24px;width:min(63vw,245px,30dvh);aspect-ratio:1;position:relative;filter:drop-shadow(0 22px 28px #0008)}.vinyl{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#19161d 0 4px,#302633 5px 6px,#131016 7px 10px);border:7px solid #201820;animation:spin 10s linear infinite;display:grid;place-items:center}.vinyl-center{width:47%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,#ec9dbd,#8b3459);display:grid;place-items:center;border:5px solid #fbd4db;overflow:hidden}.vinyl-center img{width:100%;height:100%;object-fit:cover;animation:spin-reverse 10s linear infinite;transform:scale(1.05)}@keyframes spin-reverse{from{transform:rotate(0deg) scale(1.16)}to{transform:rotate(-360deg) scale(1.16)}}.vinyl-center span{font:700 26px 'Playfair Display',serif}.vinyl-hole{position:absolute;width:8px;height:8px;border-radius:50%;background:#f6e5ea}.sparkles{font-size:32px;margin:12px 0;color:var(--gold)}@keyframes spin{to{transform:rotate(360deg)}}.big-number{font-size:clamp(72px,22vw,135px);line-height:1;font-weight:800;letter-spacing:-.08em;background:linear-gradient(180deg,#fff,#ff8eae);background-clip:text;color:transparent;margin:8px 0}.unit{font-size:17px;font-weight:700;color:#ffe4e9}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.metric{background:#ffffff12;border:1px solid #ffffff24;border-radius:18px;padding:16px 5px}.metric strong{display:block;font-size:27px}.metric span{font-size:12px;color:#d7bbce}.photo{width:min(78vw,340px);aspect-ratio:3/4;margin:0 auto 22px;border:8px solid #fff5f0;border-bottom-width:34px;border-radius:3px;transform:rotate(-3deg);box-shadow:0 25px 50px #0009;background:linear-gradient(135deg,#7a365e,#321a37);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#1e1423}.photo .placeholder{font-size:15px;line-height:1.5;color:#ffcfdd;padding:28px}.photo-caption{font-family:'Playfair Display',serif;font-style:italic;font-size:23px}.tag{display:inline-block;padding:10px 17px;border:1px solid #f6d7ec60;border-radius:40px;background:#ffffff10;color:#ffe4ec;font-size:13px;margin:5px}.letter{background:#fff9f2;color:#503044;transform:rotate(-1.5deg);border-radius:5px;padding:30px 24px;box-shadow:0 20px 70px #0008;max-height:55vh;overflow:auto;text-align:left}.letter p{font-family:Georgia,serif;font-size:17px;line-height:1.7;white-space:pre-wrap}.letter h2{font:italic 29px 'Playfair Display',serif;margin:0;color:#a6426b}.hearts{font-size:62px;animation:beat 1.5s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.15)}}.next{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:15;background:transparent;border:1px solid #ffffff60;color:#fff;border-radius:99px;padding:12px 24px;cursor:pointer;white-space:nowrap}.arrows{position:absolute;z-index:12;inset:75px 0 74px;display:flex;justify-content:space-between;pointer-events:none}.nav{background:transparent;color:white;border:0;width:19%;cursor:pointer;pointer-events:auto;font-size:22px;opacity:.6}.nav:disabled{opacity:.1}.petal{position:absolute;top:-35px;font-size:18px;animation:fall linear forwards;pointer-events:none;z-index:30}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(460deg);opacity:0}}.hint{font-size:12px;color:#dcc7d5;margin-top:15px}.date-note{font-size:14px;color:#f4c8d5}.cover-glow{position:absolute;width:320px;height:320px;top:20%;left:50%;transform:translateX(-50%);filter:blur(75px);background:#c5457460;pointer-events:none}.mini{font-size:14px;color:#ffc3d5;letter-spacing:.14em}.ending{color:#ffe2eb;font-family:'Playfair Display',serif;font-size:20px;font-style:italic}.footer-note{margin-top:12px;color:#ffe5eb80;font-size:11px}@media(max-height:680px){.scene{padding-top:82px;padding-bottom:65px}.heading{font-size:clamp(28px,min(8vw,7dvh),53px);margin-bottom:14px}.vinyl-wrap{width:min(45vw,190px,26dvh)}.photo{width:min(60vw,250px)}.letter{max-height:45vh}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.yt-dock{position:absolute;right:12px;bottom:78px;z-index:25;width:min(220px,53vw);background:#211221f5;border:1px solid #ffffff44;box-shadow:0 8px 36px #0009;padding:7px;border-radius:12px;display:none;text-align:left}.yt-dock.visible{display:block}.yt-caption{font-size:11px;margin:2px 4px 7px;color:#fff0f6;font-weight:700}.yt-dock iframe{display:block;width:100%;aspect-ratio:16/9;height:auto;border:0;border-radius:7px;background:#100b13}.yt-link{color:#ffc4d9;font-size:10px;text-decoration:underline;display:block;margin:7px 4px 2px}.scene.photo-scene{padding-bottom:168px}.scene.photo-scene .photo{height:min(52dvh,480px);width:min(72vw,340px);aspect-ratio:auto;max-height:100%;margin-bottom:13px}.scene.photo-scene .photo-caption{font-size:clamp(15px,4vw,21px);line-height:1.3}.scene.photo-scene .eyebrow{margin-bottom:12px}@media(max-height:720px){.yt-dock{width:155px;bottom:68px}.scene.photo-scene .photo{height:min(47dvh,350px)}}
</style>
</head>
<body>
<main class="shell"><div class="ambient"></div><div class="cover-glow"></div><header class="top"><div class="bars" id="bars" aria-label="Progresso da retrospectiva"></div><button class="sound" id="sound" title="Ligar ou desligar música" aria-label="Ligar ou desligar música">♫</button></header><audio id="music" src="audio/videoplayback.m4a" loop preload="auto"></audio><div class="brand">uma história chamada nós ♡</div><section id="slides" aria-live="polite"></section><div class="arrows"><button class="nav" id="prev" aria-label="Cena anterior">‹</button><button class="nav" id="next" aria-label="Próxima cena">›</button></div><button class="next" id="advance">Começar nossa história ♡</button></main>
<script>
// ╔══════════════════════════════════════════════════════════╗
// ║ PERSONALIZE APENAS O BLOCO ABAIXO PARA SEU NAMORO       ║
// ╚══════════════════════════════════════════════════════════╝
const CONFIG = {
  seuNome: 'Mansueto Onofre',
  nomeDela: 'Luana Morais',
  inicioNamoro: '2026-01-12', // AAAA-MM-DD
  fraseInicial: 'Luana, desde que você chegou, até os dias comuns se tornaram os meus favoritos.',
  musicaTitulo: 'Sunshine — Delacruz',
  fotos: [
    { arquivo: 'fotos/09.jpg', legenda: 'O nosso primeiro capítulo é só o começo.' },
    { arquivo: 'fotos/06.jpg', legenda: 'Meu sorriso preferido é aquele que aparece quando estou com você.' },
    { arquivo: 'fotos/03.jpg', legenda: 'Até as fotos espontâneas viram lembranças inesquecíveis.' },
    { arquivo: 'fotos/15.jpg', legenda: 'Cada passeio é mais bonito com você.' },
    { arquivo: 'fotos/05.jpg', legenda: 'Torcer pela vida ao seu lado é meu maior presente.' },
    { arquivo: 'fotos/20.jpg', legenda: 'Nossos momentos de aventura e carinho.' },
    { arquivo: 'fotos/25.jpg', legenda: 'Um beijo, mil sentimentos.' },
    { arquivo: 'fotos/23.jpg', legenda: 'A gente transforma qualquer lugar em uma boa memória.' },
    { arquivo: 'fotos/07.jpg', legenda: 'Contigo, as comemorações ficam ainda mais especiais.' },
    { arquivo: 'fotos/10.jpg', legenda: 'De mãos dadas, em cada novo caminho.' },
    { arquivo: 'fotos/08.jpg', legenda: 'O amor mora nesses instantes.' },
    { arquivo: 'fotos/13.jpg', legenda: 'Entre cachoeiras e abraços, somos nós.' },
    { arquivo: 'fotos/14.jpg', legenda: 'As noites iluminadas ficam melhores ao seu lado.' },
    { arquivo: 'fotos/01.jpg', legenda: 'Meu lugar favorito é bem pertinho de você.' },
    { arquivo: 'fotos/04.jpg', legenda: 'Em meio a tantos momentos, o melhor de todos é ter você comigo.' },
    { arquivo: 'fotos/11.jpg', legenda: 'As nossas fotos guardam mais do que imagens: guardam sentimento.' },
    { arquivo: 'fotos/02.jpg', legenda: 'Eu e você, colecionando dias felizes.' },
    { arquivo: 'fotos/16.jpg', legenda: 'Entre um sorriso e outro, meu coração escolhe você.' },
    { arquivo: 'fotos/18.jpg', legenda: 'Nosso amor também tem cheiro de mar e liberdade.' },
    { arquivo: 'fotos/21.jpg', legenda: 'Parceiros até na rotina e nas pequenas conquistas.' },
    { arquivo: 'fotos/19.jpg', legenda: 'A melhor companhia, em qualquer lugar do mundo.' },
    { arquivo: 'fotos/22.jpg', legenda: 'Que venham muitos outros dias assim.' }
  ],
  momentos: [
    '12 de janeiro: o começo de nós dois',
    'Cada sorriso que compartilhamos',
    'Os abraços que viraram lar',
    'Todos os planos que ainda vamos realizar'
  ],
  carta: 'Meu amor,\n\nLuana, desde quando lhe encontrei, a vida ganhou um capítulo que eu nunca quero parar de escrever. Estar com você é descobrir alegria nos detalhes: nas conversas, nas risadas, nos abraços e na paz de ter alguém tão especial por perto.\n\nNão sei quantas surpresas o futuro guarda para nós, mas sei que quero sempre continuar criando lembranças ao seu lado, cuidando de nós e celebrando cada conquista, grande ou pequena.\n\nObrigado por fazer parte da minha vida e por tornar nossa história tão bonita. Esta pequena surpresa é só um jeito de dizer que você é muito importante para mim.\n\nTe amo demais pequenininha,\nMansueto Onofre ♡'
};
// ═══════════ FIM DA PERSONALIZAÇÃO ═══════════
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const start=new Date(CONFIG.inicioNamoro+'T12:00:00');
const validDate=!Number.isNaN(start.getTime());
const days=()=>{if(!validDate)return 0;const n=new Date();return Math.max(0,Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000))};
const yearsMonths=()=>{if(!validDate)return [0,0,0];const now=new Date();let y=now.getFullYear()-start.getFullYear(),m=now.getMonth()-start.getMonth(),d=now.getDate()-start.getDate();if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}if(m<0){y--;m+=12}return [Math.max(y,0),Math.max(m,0),Math.max(d,0)]};
const scenes=[];
function add(html){scenes.push(html)}
add(`<div class="content"><div class="vinyl-wrap"><div class="vinyl"><div class="vinyl-center"><img src="fotos/12.jpg" alt="Mansueto e Luana"/></div><div class="vinyl-hole"></div></div></div><p class="eyebrow">edição especial · só nossa</p><h1 class="heading">${esc(CONFIG.seuNome)} <em>&</em> ${esc(CONFIG.nomeDela)}</h1><p class="subtitle">${esc(CONFIG.fraseInicial)}</p><p class="hint">Uma surpresa feita para a Luana. Toque para começar ✨<br><span class="music-note" id="musicNote"></span></p></div>`);
add(`<div class="content"><p class="eyebrow">capítulo 01 · nosso começo</p><div class="sparkles">✦ ♡ ✦</div><h2 class="heading">Algumas histórias <em>mudam tudo.</em></h2><p class="subtitle">A minha história favorita começou quando você chegou.</p><div class="date-note">${validDate?start.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):'Nossa data especial'}</div></div>`);
add(`<div class="content"><p class="eyebrow">o tempo ao seu lado</p><h2 class="heading">Já são...</h2><div class="big-number" id="dayCounter">${days().toLocaleString('pt-BR')}</div><div class="unit">dias criando a nossa história ♡</div><div class="metric-grid"><div class="metric"><strong id="years">0</strong><span>anos</span></div><div class="metric"><strong id="months">0</strong><span>meses</span></div><div class="metric"><strong id="days">0</strong><span>dias</span></div></div><p class="subtitle">E eu escolheria você outra vez.</p></div>`);
add(`<div class="content"><p class="eyebrow">a nossa retrospectiva</p><h2 class="heading">Cada fotografia.<br><em>Um pedacinho de nós.</em></h2><p class="subtitle">A felicidade tem muitos nomes. Para mim, ela tem o seu.</p><div class="sparkles">✧ ♥ ✧</div></div>`);
CONFIG.fotos.forEach((f,i)=>add(`<div class="content"><p class="eyebrow">memória ${String(i+1).padStart(2,'0')} / ${String(CONFIG.fotos.length).padStart(2,'0')}</p><div class="photo"><div class="placeholder">📷<br>Adicione a foto<br>${esc(f.arquivo)}</div><img src="${esc(f.arquivo)}" alt="Nossa lembrança ${i+1}" onerror="this.remove()"></div><div class="photo-caption">${esc(f.legenda)}</div></div>`));
add(`<div class="content"><p class="eyebrow">os melhores momentos</p><h2 class="heading">Nosso <em>top 4</em> ♡</h2><div>${CONFIG.momentos.slice(0,4).map((v,i)=>`<div class="tag">${i+1}. ${esc(v)}</div>`).join('')}</div><p class="hint">E a lista cresce a cada novo dia.</p></div>`);
add(`<div class="content"><p class="eyebrow">a nossa história em números</p><div class="big-number">∞</div><h2 class="heading">Motivos para <em>te amar.</em></h2><p class="subtitle">Dois corações, uma só história e um mundo inteiro para descobrir juntos.</p></div>`);
add(`<div class="content"><p class="eyebrow">uma carta para você</p><div class="letter"><h2>Meu amor, ♡</h2><p>${esc(CONFIG.carta.replace(/^Meu amor,\s*/i,''))}</p></div><p class="hint">Essa carta é só nossa.</p></div>`);
add(`<div class="content"><p class="eyebrow">ainda não é o fim</p><div class="hearts">💗</div><h2 class="heading">Se eu pudesse escolher de novo... <em>seria você.</em></h2><div class="ending">Hoje, amanhã e em todas as nossas próximas histórias.</div><p class="footer-note">Feito com amor, especialmente para ${esc(CONFIG.nomeDela)}.</p></div>`);
const slides=document.getElementById('slides'),bars=document.getElementById('bars'),advance=document.getElementById('advance'),prev=document.getElementById('prev'),next=document.getElementById('next');
scenes.forEach((html,i)=>{const sec=el('section','scene');if(i>=4&&i<4+CONFIG.fotos.length)sec.classList.add('photo-scene');sec.innerHTML=html;sec.setAttribute('aria-label',`Cena ${i+1} de ${scenes.length}`);slides.appendChild(sec);const b=el('div','bar');b.appendChild(el('i'));bars.appendChild(b)});
let current=0,started=false;
function burst(){for(let j=0;j<22;j++){const p=el('span','petal', ['♡','✦','♥'][j%3]);p.style.left=(Math.random()*100)+'%';p.style.color=['#ff9abe','#ffe1ab','#fff'][j%3];p.style.animationDuration=(2.8+Math.random()*3)+'s';p.style.setProperty('--drift',(Math.random()*140-70)+'px');document.querySelector('.shell').appendChild(p);setTimeout(()=>p.remove(),6100)}}
function show(i){if(i<0||i>=scenes.length)return;current=i;[...slides.children].forEach((s,n)=>{s.classList.toggle('active',n===i);s.setAttribute('aria-hidden',n===i?'false':'true')});[...bars.children].forEach((b,n)=>{b.classList.toggle('done',n<=i)});prev.disabled=i===0;next.disabled=i===scenes.length-1;advance.textContent=i===0?'Começar nossa história ♡':i===scenes.length-1?'Rever desde o começo ↻':'Continuar →';document.getElementById('dayCounter')?.replaceChildren(document.createTextNode(days().toLocaleString('pt-BR')));const [y,m,d]=yearsMonths();['years','months','days'].forEach((id,n)=>{const e=document.getElementById(id);if(e)e.textContent=[y,m,d][n]});if(i===scenes.length-1)burst()}
// Música de fundo: arquivo local audio/videoplayback.m4a (sem player visível).
const sound=document.getElementById('sound');
const music=document.getElementById('music');
music.addEventListener('play',()=>sound.textContent='♫');
music.addEventListener('pause',()=>sound.textContent='♪');
function startMusic(){music.play().catch(()=>sound.textContent='♪')}
function toggleMusic(){music.paused?startMusic():music.pause()}
function forward(){
  if(!started){started=true;startMusic()}
  show(current===scenes.length-1?0:current+1)
}
advance.addEventListener('click',forward);next.addEventListener('click',forward);prev.addEventListener('click',()=>show(current-1));
document.getElementById('musicNote').textContent='Nossa trilha: '+CONFIG.musicaTitulo;
sound.textContent='♪';sound.addEventListener('click',toggleMusic);
let x0=null;document.querySelector('.shell').addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});document.querySelector('.shell').addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>65){if(dx<0)forward();else show(current-1)}},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')forward();if(e.key==='ArrowLeft')show(current-1)});show(0);
</script>
</body>
</html>
